<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Google Play</title>
<style>
  :root{
    --green:#01875f;
    --green-dark:#016f4e;
    --text:#202124;
    --sub:#5f6368;
    --line:#e8eaed;
    --chip:#f1f3f4;
    --blue:#1a73e8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:#e9ecef;
    color:var(--text);
    overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}

  /* ---------- App shell ---------- */
  .phone{
    position:relative;
    max-width:760px;
    height:100vh;
    height:100dvh;
    margin:0 auto;
    background:#fff;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,.14);
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;align-items:center;gap:12px;
    padding:12px 16px 8px;
    background:#fff;
    flex-shrink:0;
  }
  .logo{
    width:30px;height:30px;flex-shrink:0;
    display:grid;place-items:center;
  }
  .searchwrap{
    flex:1;
    display:flex;align-items:center;gap:10px;
    background:var(--chip);
    border-radius:24px;
    padding:9px 16px;
    transition:background .18s, box-shadow .18s;
    min-width:0;
  }
  .searchwrap:focus-within{
    background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.18), 0 0 0 1px var(--line);
  }
  .searchwrap svg{flex-shrink:0;color:var(--sub);}
  .searchwrap input{
    flex:1;border:none;background:transparent;outline:none;
    font-size:15px;color:var(--text);min-width:0;
  }
  .searchwrap input::placeholder{color:var(--sub);}
  .avatar{
    width:32px;height:32px;border-radius:50%;
    background:linear-gradient(135deg,#1a73e8,#7b1fa2);
    color:#fff;font-size:14px;font-weight:600;
    display:grid;place-items:center;flex-shrink:0;
  }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;gap:6px;
    padding:0 16px;
    border-bottom:1px solid var(--line);
    overflow-x:auto;
    flex-shrink:0;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    position:relative;
    padding:12px 14px 14px;
    font-size:14px;font-weight:500;
    color:var(--sub);
    white-space:nowrap;
    transition:color .15s;
  }
  .tab.active{color:var(--green);}
  .tab.active::after{
    content:"";position:absolute;left:8px;right:8px;bottom:0;height:3px;
    background:var(--green);border-radius:3px 3px 0 0;
  }

  /* ---------- Main scroll area ---------- */
  main{
    flex:1;overflow-y:auto;overflow-x:hidden;
    scrollbar-width:thin;
    -webkit-overflow-scrolling:touch;
  }
  main::-webkit-scrollbar{width:6px;}
  main::-webkit-scrollbar-thumb{background:#dadce0;border-radius:3px;}

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    display:flex;
    border-top:1px solid var(--line);
    background:#fff;
    flex-shrink:0;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .navitem{
    flex:1;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:9px 2px 8px;
    font-size:11px;font-weight:500;
    color:var(--sub);
    transition:color .15s;
  }
  .navitem .ic{
    width:26px;height:22px;
    display:grid;place-items:center;
    border-radius:12px;
    transition:background .2s;
  }
  .navitem.active{color:var(--green);}
  .navitem.active .ic{background:#e6f4ea;}
  .navitem:active .ic{background:#e8f0fe;}

  /* ---------- Hero carousel ---------- */
  .hero{
    display:flex;gap:12px;
    padding:16px;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scrollbar-width:none;
  }
  .hero::-webkit-scrollbar{display:none;}
  .hero-card{
    position:relative;
    min-width:290px;height:170px;
    border-radius:18px;
    padding:18px;
    color:#fff;
    display:flex;flex-direction:column;justify-content:flex-end;
    overflow:hidden;
    scroll-snap-align:start;
    flex-shrink:0;
    cursor:pointer;
    transition:transform .18s, box-shadow .18s;
  }
  .hero-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.2);}
  .hero-card .bigemoji{
    position:absolute;right:-6px;top:-6px;
    font-size:96px;opacity:.28;
    transform:rotate(-12deg);
    pointer-events:none;
  }
  .hero-badge{
    font-size:10px;font-weight:700;letter-spacing:1.2px;
    opacity:.85;margin-bottom:4px;
  }
  .hero-title{font-size:19px;font-weight:600;line-height:1.2;}
  .hero-sub{font-size:12.5px;opacity:.85;margin-top:3px;}

  /* ---------- Section headers ---------- */
  .sec-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 16px 10px;
  }
  .sec-head h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.2px;}
  .sec-head .more{font-size:13px;font-weight:600;color:var(--green);}

  /* ---------- Horizontal card row ---------- */
  .hrow{
    display:flex;gap:10px;
    padding:0 16px 6px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .hrow::-webkit-scrollbar{display:none;}
  .hcard{
    width:124px;flex-shrink:0;
    display:flex;flex-direction:column;align-items:center;
    gap:7px;
    padding:12px 6px 10px;
    border-radius:14px;
    cursor:pointer;
    transition:background .15s;
    text-align:center;
  }
  .hcard:hover{background:#f8f9fa;}
  .hcard .nm{
    font-size:12.5px;font-weight:500;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;
  }
  .hcard .rt{font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:3px;}

  /* ---------- App icon ---------- */
  .appicon{
    border-radius:22%;
    display:grid;place-items:center;
    flex-shrink:0;
    box-shadow:0 1px 4px rgba(0,0,0,.16);
    user-select:none;
  }

  /* ---------- Vertical list ---------- */
  .vrow{
    display:flex;gap:14px;align-items:center;
    padding:11px 16px;
    cursor:pointer;
    transition:background .15s;
  }
  .vrow:hover{background:#f8f9fa;}
  .vrow .meta{flex:1;min-width:0;}
  .vrow .nm{
    font-size:14px;font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .vrow .dv{
    font-size:12px;color:var(--sub);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-top:1px;
  }
  .vrow .rt{
    font-size:12px;color:var(--sub);
    display:flex;align-items:center;gap:4px;margin-top:3px;
  }
  .rank{
    width:20px;flex-shrink:0;
    font-size:15px;font-weight:600;color:var(--sub);
    text-align:center;
  }

  /* ---------- Install pills ---------- */
  .pill{
    flex-shrink:0;
    padding:7px 18px;
    border-radius:18px;
    font-size:13px;font-weight:600;
    color:var(--green);
    background:transparent;
    border:1px solid #dadce0;
    transition:background .15s,border-color .15s;
    min-width:78px;
    text-align:center;
  }
  .pill:hover{background:#e6f4ea;border-color:transparent;}
  .pill.done{color:var(--green);border-color:#dadce0;}
  .pill.busy{
    padding:7px 10px;min-width:78px;
    color:var(--sub);font-weight:500;
  }
  .miniprog{
    width:100%;height:3px;border-radius:3px;background:#dadce0;overflow:hidden;margin-top:5px;
  }
  .miniprog i{display:block;height:100%;background:var(--green);width:0;animation:fill 1.6s ease forwards;}
  @keyframes fill{to{width:100%;}}

  /* ---------- Categories grid ---------- */
  .catgrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:10px;
    padding:16px;
  }
  .cattile{
    display:flex;align-items:center;gap:12px;
    padding:14px;
    border-radius:14px;
    background:#f8f9fa;
    font-size:13.5px;font-weight:500;
    cursor:pointer;
    transition:background .15s,transform .15s;
    text-align:left;
  }
  .cattile:hover{background:#e8eaed;transform:translateY(-1px);}
  .cattile span{font-size:22px;}

  /* ---------- Chips ---------- */
  .chips{
    display:flex;gap:8px;padding:4px 16px 12px;
    overflow-x:auto;scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    padding:7px 15px;border-radius:16px;
    background:#fff;border:1px solid #dadce0;
    font-size:13px;font-weight:500;color:var(--sub);
    white-space:nowrap;flex-shrink:0;
    transition:background .15s,color .15s;
  }
  .chip:hover{background:#f1f3f4;}
  .chip.on{background:#e6f4ea;border-color:transparent;color:var(--green);font-weight:600;}

  .backline{
    display:flex;align-items:center;gap:10px;
    padding:14px 16px 4px;
  }
  .backline button{
    display:flex;align-items:center;gap:6px;
    font-size:14px;font-weight:600;color:var(--green);
  }

  .empty{
    padding:80px 24px;text-align:center;color:var(--sub);
  }
  .empty .em{font-size:52px;margin-bottom:12px;}
  .empty p{margin:6px 0;font-size:14px;}

  .divider{height:8px;background:#f8f9fa;margin-top:12px;}

  /* ---------- Detail overlay ---------- */
  .detail{
    position:absolute;inset:0;
    background:#fff;
    z-index:60;
    display:flex;flex-direction:column;
    transform:translateX(100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    visibility:hidden;
  }
  .detail.open{transform:translateX(0);visibility:visible;}
  .dbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px;
    flex-shrink:0;
  }
  .iconbtn{
    width:40px;height:40px;border-radius:50%;
    display:grid;place-items:center;color:var(--text);
    transition:background .15s;
  }
  .iconbtn:hover{background:#f1f3f4;}
  .dscroll{flex:1;overflow-y:auto;padding-bottom:40px;}

  .dhead{display:flex;gap:16px;padding:6px 20px 16px;align-items:center;}
  .dhead h1{
    margin:0;font-size:22px;font-weight:600;letter-spacing:-.3px;line-height:1.2;
  }
  .dhead .dv{font-size:13px;color:var(--green);font-weight:500;margin-top:4px;}
  .dhead .sub{font-size:12px;color:var(--sub);margin-top:2px;}

  .stats{
    display:flex;align-items:center;gap:0;
    padding:8px 20px 20px;
    overflow-x:auto;scrollbar-width:none;
  }
  .stats::-webkit-scrollbar{display:none;}
  .stat{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:0 20px;flex-shrink:0;
  }
  .stat:first-child{padding-left:0;}
  .stat b{font-size:14px;font-weight:600;display:flex;align-items:center;gap:3px;}
  .stat span{font-size:11.5px;color:var(--sub);}
  .vline{width:1px;height:26px;background:var(--line);flex-shrink:0;}

  .installwrap{padding:0 20px 20px;}
  .biginstall{
    width:100%;
    padding:14px;
    border-radius:10px;
    background:var(--green);
    color:#fff;
    font-size:15px;font-weight:600;
    transition:background .15s, transform .1s;
  }
  .biginstall:hover{background:var(--green-dark);}
  .biginstall:active{transform:scale(.99);}
  .biginstall.done{background:#fff;color:var(--green);border:1px solid #dadce0;}
  .biginstall.busy{background:#e6f4ea;color:var(--green);}

  .shots{
    display:flex;gap:12px;padding:4px 20px 22px;
    overflow-x:auto;scrollbar-width:none;
  }
  .shots::-webkit-scrollbar{display:none;}
  .shot{
    width:170px;height:290px;flex-shrink:0;
    border-radius:14px;
    display:grid;place-items:center;
    font-size:58px;
    box-shadow:0 1px 4px rgba(0,0,0,.14);
  }

  .block{padding:0 20px 8px;}
  .block h3{
    margin:0 0 10px;
    font-size:16px;font-weight:600;
    display:flex;justify-content:space-between;align-items:center;
  }
  .block h3 .arw{color:var(--sub);font-size:14px;font-weight:400;}
  .block p{
    margin:0;font-size:14px;line-height:1.6;color:#3c4043;
  }
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
  .tag{
    padding:6px 14px;border-radius:16px;
    border:1px solid #dadce0;
    font-size:12.5px;color:var(--sub);
  }

  .similar{
    display:flex;gap:12px;padding:0 20px 24px;
    overflow-x:auto;scrollbar-width:none;
  }
  .similar::-webkit-scrollbar{display:none;}
  .scard{
    width:110px;flex-shrink:0;text-align:center;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:7px;
  }
  .scard .nm{
    font-size:12px;font-weight:500;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  .fadein{animation:fade .3s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  @media (max-width:420px){
    .hero-card{min-width:250px;height:150px;}
    .hcard{width:110px;}
    .shot{width:150px;height:255px;}
  }
</style>
</head>

/* =========================================================
   HELPERS
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const STAR = `<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" style="flex-shrink:0"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;

function iconHTML(app, size = 48) {
  const fs = Math.round(size * 0.52);
  return `<div class="appicon" style="width:${size}px;height:${size}px;font-size:${fs}px;background:linear-gradient(135deg,${app.c1},${app.c2})">${app.icon}</div>`;
}

function ratingHTML(app) {
  return `<span class="rt">${app.rating.toFixed(1)} ${STAR}</span>`;
}

function byId(id) { return APPS.find(a => a.id === id); }

function sectionApps() {
  return APPS.filter(a => a.cat === state.section);
}

function installButtonHTML(app, big = false) {
  const cls = big ? "biginstall" : "pill";
  if (installed.has(app.id)) {
    return `<button class="${cls} done" data-install="${app.id}">Open</button>`;
  }
  if (app._busy) {
    return `<button class="${cls} busy" data-install="${app.id}">Installing
      <div class="miniprog"><i></i></div>
    </button>`;
  }
  return `<button class="${cls}" data-install="${app.id}">${big ? "Install" : "Install"}</button>`;
}

function installApp(id) {
  const app = byId(id);
  if (!app || installed.has(app.id) || app._busy) return;
  app._busy = true;
  render(false);
  if (state.currentApp && state.currentApp.id === id) openDetail(id, false);
  setTimeout(() => {
    app._busy = false;
    installed.add(id);
    render(false);
    if (state.currentApp && state.currentApp.id === id) openDetail(id, false);
  }, 1650);
}

/* =========================================================
   RENDER — MAIN
   ========================================================= */
function render(resetScroll = true) {
  const main = $("#main");
  const prevScroll = main.scrollTop;

  if (state.query.trim()) {
    main.innerHTML = viewSearch();
  } else if (state.genre) {
    main.innerHTML = viewGenre();
  } else if (state.tab === "foryou") {
    main.innerHTML = viewForYou();
  } else if (state.tab === "top") {
    main.innerHTML = viewTopCharts();
  } else if (state.tab === "categories") {
    main.innerHTML = viewCategories();
  } else {
    main.innerHTML = viewNew();
  }

  main.scrollTop = resetScroll ? 0 : prevScroll;
}

    ${newer.map(a => `
      <div class="vrow" data-app="${a.id}">

}

/* ---------- Search results ---------- */
function viewSearch() {
  const q = state.query.trim().toLowerCase();
  const results = APPS.filter(a =>
    a.name.toLowerCase().includes(q) ||
    a.dev.toLowerCase().includes(q) ||
    a.genre.toLowerCase().includes(q)
  );

  if (!results.length) {
    return `<div class="empty fadein">
      <div class="em">🔍</div>
      <p>No results for "<b>${escapeHTML(state.query)}</b>"</p>
      <p style="font-size:13px">Try a different keyword or check your spelling.</p>
    </div>`;
  }

  return `
  <div class="fadein">
    <div class="sec-head"><h2>${results.length} result${results.length > 1 ? "s" : ""}</h2></div>
    ${results.map(a => `
      <div class="vrow" data-app="${a.id}">
        ${iconHTML(a, 54)}
        <div class="meta">
          <div class="nm">${highlight(a.name, q)}</div>
          <div class="dv">${a.dev} · ${a.genre}</div>
          <div class="rt">${a.rating.toFixed(1)} ${STAR} · ${a.dl}</div>
        </div>
        ${installButtonHTML(a)}
      </div>`).join("")}
    <div style="height:24px"></div>
  </div>`;
}

function highlight(text, q) {
  if (!q) return text;
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return text;
  return text.slice(0, i) + "<b>" + text.slice(i, i + q.length) + "</b>" + text.slice(i + q.length);
}

function escapeHTML(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function emptyState() {
  return `<div class="empty"><div class="em">📭</div><p>No content in this section</p></div>`;
}

function openDetail(id, animate = true) {
  const app = byId(id);
  if (!app) return;
  state.currentApp = app;
  const d = $("#detail");

  const similar = APPS.filter(a => a.cat === app.cat && a.id !== app.id).slice(0, 8);
  const shotGradients = [
    `linear-gradient(160deg,${app.c1},${app.c2})`,
    `linear-gradient(160deg,${app.c2},${app.c1})`,
    `linear-gradient(160deg,${app.c1}cc,${app.c2}99)`,
    `linear-gradient(160deg,${app.c2}dd,${app.c1}bb)`
  ];
  const shotEmojis = ["🎮", "🏆", "⭐", "🎯"];

  d.innerHTML = `
    <div class="dbar">
      <button class="iconbtn" id="backBtn" aria-label="Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div style="display:flex;gap:2px">
        <button class="iconbtn" aria-label="Share">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81a3 3 0 1 0-3-3c0 .24.04.47.09.7L8.04 9.81A3 3 0 1 0 6 15c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65a2.92 2.92 0 1 0 2.92-2.92z"/></svg>
        </button>
        <button class="iconbtn" aria-label="More">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </button>
      </div>
    </div>

    <div class="dscroll">
      <div class="dhead">
        ${iconHTML(app, 82)}
        <div style="min-width:0">
          <h1>${app.name}</h1>
          <div class="dv">${app.dev}</div>
          <div class="sub">${app.genre} · In-app purchases</div>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><b>${app.rating.toFixed(1)} ${STAR}</b><span>${(Math.random() * 8 + 1).toFixed(1)}M reviews</span></div>
        <div class="vline"></div>
        <div class="stat"><b>${app.dl}</b><span>Downloads</span></div>
        <div class="vline"></div>
        <div class="stat"><b>${app.age}</b><span>Rated for</span></div>
        <div class="vline"></div>
        <div class="stat"><b>${app.size}</b><span>Size</span></div>
      </div>

      <div class="installwrap">
        ${installButtonHTML(app, true)}
      </div>

      <div class="shots">
        ${shotGradients.map((g, i) => `
          <div class="shot" style="background:${g}">${shotEmojis[i]}</div>`).join("")}
      </div>

      <div class="block">
        <h3>About this app <span class="arw">›</span></h3>
        <p>${app.desc}</p>
        <div class="tags">
          <span class="tag">${app.genre}</span>
          <span class="tag">${app.age}</span>
          <span class="tag">${app.dl} downloads</span>
        </div>
      </div>

      <div style="height:24px"></div>

      <div class="block" style="padding-bottom:14px">
        <h3>Similar ${app.cat} <span class="arw">›</span></h3>
      </div>
      <div class="similar">
        ${similar.map(s => `
          <div class="scard" data-app="${s.id}">
            ${iconHTML(s, 60)}
            <div class="nm">${s.name}</div>
            <div class="rt" style="font-size:11px;color:var(--sub);display:flex;gap:3px;align-items:center">${s.rating.toFixed(1)} ${STAR}</div>
          </div>`).join("")}
      </div>
      <div style="height:20px"></div>
    </div>
  `;

  if (animate) {
    requestAnimationFrame(() => d.classList.add("open"));
  } else {
    d.classList.add("open");
  }
  d.querySelector(".dscroll").scrollTop = 0;
}

function closeDetail() {
  $("#detail").classList.remove("open");
  state.currentApp = null;
}

/* =========================================================
   EVENTS
   ========================================================= */
// Global click delegation
document.addEventListener("click", (e) => {
  // Install buttons (anywhere)
  const inst = e.target.closest("[data-install]");
  if (inst) {
    e.stopPropagation();
    e.preventDefault();
    installApp(Number(inst.dataset.install));
    return;
  }

  // Category tile
  const tile = e.target.closest("[data-genre]");
  if (tile) {
    state.genre = tile.dataset.genre;
    state.query = "";
    $("#searchInput").value = "";
    render();
    return;
  }

  // Clear genre
  if (e.target.closest("[data-cleargenre]")) {
    state.genre = null;
    render();
    return;
  }

  // App card / row
  const appEl = e.target.closest("[data-app]");
  if (appEl) {
    openDetail(Number(appEl.dataset.app));
    return;
  }

  // Back button in detail
  if (e.target.closest("#backBtn")) {
    closeDetail();
    return;
  }
});

// Tabs
$("#tabs").addEventListener("click", (e) => {
  const t = e.target.closest(".tab");
  if (!t) return;
  $$(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  state.tab = t.dataset.tab;
  state.genre = null;
  state.query = "";
  $("#searchInput").value = "";
  render();
});

// Bottom nav
$("#bottomnav").addEventListener("click", (e) => {
  const n = e.target.closest(".navitem");
  if (!n) return;
  $$(".navitem").forEach(x => x.classList.remove("active"));
  n.classList.add("active");
  state.section = n.dataset.section;
  state.genre = null;
  state.query = "";
  $("#searchInput").value = "";
  render();
});

// Search input
let searchTimer;
$("#searchInput").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  const val = e.target.value;
  searchTimer = setTimeout(() => {
    state.query = val;
    if (val.trim()) state.genre = null;
    render();
  }, 160);
});

// Escape closes detail / clears search
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (state.currentApp) closeDetail();
    else if (state.query) {
      state.query = "";
      $("#searchInput").value = "";
      render();
    }
  }
});

// Swipe-back gesture on detail
(function swipeBack() {
  const d = $("#detail");
  let startX = 0, startY = 0, tracking = false;
  d.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = startX < 60;
  }, { passive: true });
  d.addEventListener("touchmove", (e) => {
    if (!tracking) return;
    const dx = e.touches[0].clientX - startX;
    const dy = Math.abs(e.touches[0].clientY - startY);
    if (dx > 90 && dy < 60) {
      tracking = false;
      closeDetail();
    }
  }, { passive: true });
  d.addEventListener("touchend", () => { tracking = false; }, { passive: true });
})();

/* =========================================================
   BOOT
   ========================================================= */
render();
</script>
</body>
</html>
